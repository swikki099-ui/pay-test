<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NovaStore</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,sans-serif;background:#0f1115;color:#e8eaed}
  .nav{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid #2a2f3a;background:#0f1115;position:sticky;top:0;z-index:5}
  .nav .logo{font-size:20px;font-weight:800}
  .nav .logo span{color:#4c8dff}
  .nav small{color:#9aa0a6;font-size:12px}
  .wrap{max-width:900px;margin:0 auto;padding:28px 16px 60px}
  h1{font-size:28px;margin-bottom:6px}
  .sub{color:#9aa0a6;margin-bottom:28px;font-size:14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
  .card{background:#181b22;border:1px solid #2a2f3a;border-radius:14px;padding:20px;display:flex;flex-direction:column}
  .card .img{font-size:60px;text-align:center;background:linear-gradient(145deg,#1b1f28,#22262f);border-radius:12px;padding:24px 0;margin-bottom:14px}
  .card h3{font-size:17px;margin-bottom:6px}
  .card .desc{color:#9aa0a6;font-size:13px;line-height:1.5;flex:1;margin-bottom:14px}
  .card .price{font-size:22px;font-weight:700;margin-bottom:14px}
  .card .price small{color:#9aa0a6;font-weight:400;font-size:13px}
  .btn{border:0;border-radius:9px;font-size:14px;font-weight:600;padding:12px;cursor:pointer;width:100%}
  .btn.blue{background:#4c8dff;color:#fff}
  .btn.blue:hover{filter:brightness(1.1)}
  .btn.dark{background:#21242d;color:#e8eaed}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .err{color:#ff6b6b;margin-top:12px;font-size:13px;text-align:center}
</style>
</head>
<body>
<div class="nav">
  <div class="logo">Nova<span>Store</span></div>
  <small>UPI checkout demo</small>
</div>
<div class="wrap">
  <h1>Shop</h1>
  <div class="sub">Pick an item, pay the exact dynamic amount via UPI.</div>
  <div class="grid" id="grid"></div>
  <div id="err" class="err" style="display:none"></div>
</div>
<div id="payModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:10;display:none;align-items:center;justify-content:center;padding:16px">
  <div style="background:#181b22;border:1px solid #2a2f3a;border-radius:16px;padding:24px;max-width:440px;width:100%;max-height:90vh;overflow:auto">
    <h2 id="pmTitle" style="font-size:18px;margin-bottom:4px"></h2>
    <div id="pmSub" style="color:#9aa0a6;font-size:13px;margin-bottom:14px"></div>
    <div id="pmBody"></div>
    <button class="btn dark" style="margin-top:12px" onclick="closePay()">Close</button>
  </div>
</div>

<script>
const PRODUCTS = [
  { id:"earbuds", name:"Wireless Earbuds Pro", price:1299, icon:"&#127911;", desc:"Active noise cancellation, 40h battery, Bluetooth 5.3." },
  { id:"watch",   name:"Smartwatch Series 5",  price:2499, icon:"&#8986;",   desc:"AMOLED display, heart-rate & SpO2, 7-day battery." },
  { id:"power",   name:"20000mAh Power Bank",  price:899,  icon:"&#128267;", desc:"22.5W fast charge, dual USB + Type-C, travel friendly." }
];

let currentProduct = null;
let orderData = null;
let pollTimer = null;

// Render products immediately (no fetch needed)
(function renderGrid() {
  const g = document.getElementById("grid");
  for (const p of PRODUCTS) {
    g.innerHTML += `
      <div class="card">
        <div class="img">${p.icon}</div>
        <h3>${p.name}</h3>
        <div class="desc">${p.desc}</div>
        <div class="price">₹${p.price.toLocaleString("en-IN")} <small>incl. GST</small></div>
        <button class="btn blue" onclick="openPay('${p.id}')">Buy Now</button>
      </div>`;
  }
})();

function showErr(m) { const e=document.getElementById("err"); e.style.display="block"; e.textContent=m; }
function hideErr()  { document.getElementById("err").style.display="none"; }

function openPay(pid) {
  currentProduct = PRODUCTS.find(p=>p.id===pid);
  if (!currentProduct) return;
  document.getElementById("pmTitle").textContent = currentProduct.name;
  document.getElementById("pmSub").textContent  = "₹" + currentProduct.price.toLocaleString("en-IN") + " · enter your mobile";
  document.getElementById("pmBody").innerHTML = `
    <input id="mbl" inputmode="numeric" placeholder="10-digit mobile" style="width:100%;padding:11px;border-radius:9px;border:1px solid #2a2f3a;background:#0f1115;color:#e8eaed;font-size:14px;margin-bottom:12px" />
    <button class="btn blue" id="createBtn" onclick="createOrder()">Pay ₹${currentProduct.price.toLocaleString("en-IN")}</button>
    <div id="pmMsg" style="margin-top:10px"></div>`;
  document.getElementById("payModal").style.display = "flex";
}

function closePay() {
  clearInterval(pollTimer);
  document.getElementById("payModal").style.display = "none";
}

async function createOrder() {
  const btn  = document.getElementById("createBtn");
  const msg  = document.getElementById("pmMsg");
  const mbl  = (document.getElementById("mbl")||{}).value||"";
  btn.disabled = true; btn.textContent = "Creating order\u2026";
  hideErr();
  try {
    const res = await fetch("/api/create", {
      method:"POST",
      headers:{"content-type":"application/json"},
      body:JSON.stringify({
        baseAmount:currentProduct.price,
        orderIdExt: currentProduct.id+"-"+Date.now().toString().slice(-6),
        returnUrl:"http://localhost:3001/"
      })
    });
    const json = await res.json();
    if (!res.ok || !json.success) throw new Error(json.error||("HTTP "+res.status));
    orderData = json.data;

    // Save mobile
    if (mbl.replace(/\D/g,"").length===10) {
      fetch("/api/mobile",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({orderId:orderData.orderId,mobile:mbl.replace(/\D/g,"")})});
    }

    // Show payment UI
    msg.innerHTML = `
      <div style="text-align:center;margin:14px 0">
        <img src="${orderData.qrCodeDataUrl}" style="width:200px;border-radius:10px;background:#fff;padding:6px" /><br/>
        <div style="font-size:24px;font-weight:800;margin:10px 0">₹${orderData.dynamicAmount}</div>
        <div style="font-size:12px;color:#9aa0a6">pay this exact amount via any UPI app</div>
      </div>
      <a href="${orderData.upiUri}" target="_blank" class="btn blue" style="display:block;text-align:center;text-decoration:none;margin-bottom:8px">Open in UPI App</a>
      <a href="${orderData.upiUri}" target="_blank" class="btn dark" style="text-align:center;display:block;text-decoration:none">Hosted checkout</a>
      <div id="pollStatus" style="text-align:center;margin-top:12px;color:#9aa0a6;font-size:13px">waiting for payment\u2026</div>`;
    btn.style.display = "none";

    startPoll();
  } catch (err) {
    msg.innerHTML = "<div class='err'>"+err.message+"</div>";
    btn.disabled = false; btn.textContent = "Pay \u20B9"+currentProduct.price.toLocaleString("en-IN");
  }
}

function startPoll() {
  clearInterval(pollTimer);
  poll();
  pollTimer = setInterval(poll, 3000);
}

async function poll() {
  if (!orderData) return;
  try {
    const res = await fetch("/api/status/"+orderData.orderId);
    const json = await res.json();
    if (!json.success) return;
    const s = json.data.status;
    const el = document.getElementById("pollStatus");
    if (!el) return;
    if (s==="PAID") {
      clearInterval(pollTimer);
      el.style.color="#2ecc71";
      el.innerHTML="<b style='font-size:16px'>&#10003; Payment confirmed!</b><br/>Order: "+orderData.orderId.slice(0,8)+"\u2026";
    } else if (s==="EXPIRED") {
      clearInterval(pollTimer);
      el.style.color="#ff6b6b";
      el.innerHTML="Order expired.";
    } else {
      el.textContent="waiting for payment\u2026";
    }
  } catch(e) {}
}
</script>
</body>
</html>
